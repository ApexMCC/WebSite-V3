<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg-primary: #0d140c;
      --accent-green-light: #3bc94e;
      --accent-green: #33a33f;
      --accent-green-dark: #277a32;
      --accent-green-deep: #18401c;
      --text-light: #eaf1eb;
      --gray-muted: #506553;
      --gray-dark: #29312b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ===== TOP HEADER ===== */
    .navbar {
      position: relative;
      width: 100%;
      color: white;
      background:
        linear-gradient(rgba(0, 0, 0, 0.38), rgba(0, 0, 0, 0.38)),
        url("https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=2000&q=80")
        center / cover;
    }

    .navbar-top {
      height: 138px;
      max-width: 1150px;
      margin: auto;
      padding: 25px 0 20px;
      position: relative;
    }

    /* Top links */
    .top-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .top-links-left {
      display: flex;
      gap: 7px;
    }

    .top-links-right {
      display: flex;
      gap: 8px;
    }

    .top-links a {
      color: white;
      text-decoration: none;
    }

    /* Logo */
    .logo {
      position: absolute;
      left: 0;
      bottom: 23px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .spartan-logo {
      width: 34px;
      height: 34px;
      border: 3px solid var(--accent-green-light);
      border-radius: 50%;
      position: relative;
    }

    .spartan-logo::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 9px;
      border-left: 3px solid var(--accent-green-light);
      border-bottom: 3px solid var(--accent-green-light);
      transform: rotate(-25deg);
      left: 4px;
      top: 10px;
    }

    /* Search */
    .search-box {
      position: absolute;
      right: 0;
      bottom: 25px;
      width: 325px;
      height: 42px;
      background: white;
      display: flex;
      align-items: center;
    }

    .search-box input {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      padding: 0 15px;
      font-size: 16px;
      color: #222;
    }

    .search-icon {
      width: 50px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111;
      font-size: 22px;
    }

    /* ===== GREEN NAVIGATION ===== */
    .main-nav {
      height: 42px;
      background: var(--accent-green-deep);
    }

    .main-nav-inner {
      max-width: 1150px;
      height: 100%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0;
      height: 100%;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 15px;
      padding: 0 11px;
      transition: opacity 0.2s, color 0.2s;
    }

    .nav-links a:hover {
      color: var(--accent-green-light);
    }

    .nav-links a:not(:last-child)::after {
      content: "|";
      margin-left: 11px;
      opacity: 0.8;
    }

    /* ApexToday */
    .apex-today {
      height: 48px;
      margin-top: -6px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      background: white;
      color: #333;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s;
    }

    .apex-today:hover {
      background: var(--text-light);
    }

    /* ===== MOBILE ===== */
    @media (max-width: 800px) {
      .navbar-top {
        height: 125px;
        padding: 20px;
      }

      .top-links {
        font-size: 12px;
      }

      .top-links-left {
        display: none;
      }

      .logo {
        left: 20px;
        bottom: 20px;
        font-size: 15px;
      }

      .search-box {
        right: 20px;
        bottom: 20px;
        width: 220px;
      }

      .main-nav-inner {
        padding: 0 15px;
        overflow-x: auto;
      }

      .nav-links {
        white-space: nowrap;
      }

      .nav-links a {
        font-size: 13px;
        padding: 0 7px;
      }

      .nav-links a:not(:last-child)::after {
        margin-left: 7px;
      }

      .apex-today {
        display: none;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">

    <!-- Top section -->
    <div class="navbar-top">

      <div class="top-links">
        <div class="top-links-left">
          <a href="#">For: Future Students</a>
          <span>|</span>
          <a href="#">Current Students</a>
          <span>|</span>
          <a href="#">Alumni</a>
          <span>|</span>
          <a href="#">Faculty & Staff</a>
        </div>

        <div class="top-links-right">
          <a href="#">Apply</a>
          <span>|</span>
          <a href="#">Visit</a>
          <span>|</span>
          <a href="#">Give</a>
        </div>
      </div>

      <!-- Logo -->
      <div class="logo">
        <div class="spartan-logo"></div>
        <span>APEX SYSTEMS</span>
      </div>

      <!-- Search -->
      <div class="search-box">
        <input type="text" placeholder="Search" />
        <div class="search-icon">⌕</div>
      </div>

    </div>

    <!-- Green navigation -->
    <nav class="main-nav">
      <div class="main-nav-inner">

        <div class="nav-links">
          <a href="#">About</a>
          <a href="#">Admissions</a>
          <a href="#">Academics</a>
          <a href="#">Research</a>
          <a href="#">Campus Life</a>
          <a href="#">Athletics</a>
        </div>

        <a href="#" class="apex-today">
          ApexToday
        </a>

      </div>
    </nav>

  </header>

</body>
</html>
